{# An observation's outcome and warning: an alert unless observed, otherwise a note. #}
{% if not observation.observed %}
  <div class="usa-alert usa-alert--warning usa-alert--slim">
    <div class="usa-alert__body">
      <p class="usa-alert__text">
        <strong>{{ observation.outcome.label }}:</strong> {{ observation.warning }}
      </p>
    </div>
  </div>
{% elif observation.warning %}
  <p class="barectl-note">{{ observation.warning }}</p>
{% endif %}
