<nav class="barectl-layout__nav" aria-label="Server sections">
  <ul class="usa-sidenav">
    {% for item in server_sections %}
      <li class="usa-sidenav__item">
        <a href="{{ item.url }}"
           {% if section == item.key %}class="usa-current" aria-current="page"{% endif %}>{{ item.title }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
