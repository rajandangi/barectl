{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}Barectl{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'app.css' %}">
  </head>
  <body>
    <header>
      <a class="brand" href="{% url 'servers' %}">Barectl</a>
      <span>Native Linux, managed over SSH</span>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Sign out</button>
        </form>
      {% endif %}
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
