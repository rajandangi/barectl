name: Checks
on:
  pull_request:
  push:
    branches:
      - main
      - release
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      BARECTL_DEBUG: "1"
      BARECTL_SECRET_KEY: ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run vulture
      - run: uv run djlint templates --lint --check
      - run: uv run python manage.py check --fail-level WARNING
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py test
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked
      - run: uv run pip-audit --strict
      - run: npm ci
      - run: npm run audit:dependencies
