name: Checks
on:
  pull_request:
  push:
    branches:
      - main
      - release
permissions:
  contents: read
# A newer commit on a pull request supersedes its running checks; every push to main or
# release keeps its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      BARECTL_DEBUG: "1"
      BARECTL_SECRET_KEY: ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run vulture
      - run: uv run djlint templates --lint --check
      - run: uv run python manage.py check --fail-level WARNING
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py test --exclude-tag browser
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
  browser:
    runs-on: ubuntu-24.04
    env:
      BARECTL_DEBUG: "1"
      BARECTL_SECRET_KEY: ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npm run build
      - run: uv run playwright install --with-deps chromium
      - run: uv run python manage.py test --tag browser
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked
      - run: uv run pip-audit --strict
      - run: npm ci
      - run: npm run audit:dependencies
  native-gate:
    # Records the native statuses for pull requests that change no native-affecting path;
    # see docs/quality.md#native-suites.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: >-
          docker/disposable-server/native-gate.sh
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
