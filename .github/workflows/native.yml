name: Native
# docs/quality.md#native-layer
on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test instead of the selected branch
        type: string
        required: false
permissions:
  contents: read
# A newer commit on a pull request supersedes its running native check; a manual run keeps
# its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # docs/quality.md#native-affecting-paths: a pull request with no native-affecting change
  # leaves this green at the exempt-path step; every other path is native-affecting.
  paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      affecting: ${{ steps.diff.outputs.affecting }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: diff
        run: |
          affecting=$(git diff --name-only --no-renames \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | docker/disposable-server/native-paths.sh)
          if [ -n "$affecting" ]; then
            echo "affecting=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$affecting"
          else
            echo "affecting=false" >> "$GITHUB_OUTPUT"
          fi
  scenarios:
    needs: paths
    if: always() && (github.event_name != 'pull_request' || needs.paths.outputs.affecting == 'true')
    name: scenarios (${{ matrix.shard }}/2)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      BARECTL_DEBUG: "1"
      BARECTL_SECRET_KEY: ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Restore the mirror
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/barectl/native/mirror
          key: native-mirror-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/disposable-server/mirror-manifest.json') }}
      - run: docker/disposable-server/mirror.sh -- fetch
      - id: l0
        run: echo "key=$(uv run python -m disposable.images cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the L0 snapshot
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/native-l0
          key: native-l0-${{ runner.os }}-${{ runner.arch }}-${{ steps.l0.outputs.key }}
      - run: |
          mkdir -p "$RUNNER_TEMP/native/logs"
          export BARECTL_NATIVE_L0_CACHE="$RUNNER_TEMP/native-l0"
          export BARECTL_DISPOSABLE_LOGS="$RUNNER_TEMP/native/logs"
          docker/disposable-server/run-scenarios.sh -- --shard ${{ matrix.shard }}/2
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-scenarios-${{ matrix.shard }}
          path: ${{ runner.temp }}/native
          if-no-files-found: ignore
  # The one required check (docs/quality.md#native-affecting-paths). It replaces the old
  # `native (Ubuntu 26.04)` commit status.
  native:
    needs: [paths, scenarios]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Judge the native check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             [ "${{ needs.paths.outputs.affecting }}" = "false" ]; then
            echo "No native-affecting changes."
            exit 0
          fi
          if [ "${{ needs.scenarios.result }}" = "success" ]; then
            echo "The native scenarios passed."
            exit 0
          fi
          echo "The native scenarios did not pass (${{ needs.scenarios.result }})." >&2
          exit 1
