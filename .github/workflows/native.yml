name: Native
# docs/quality.md#running-them-in-ci
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test instead of the selected branch
        type: string
        required: false
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
# Adding any other label must not cancel a native run in progress.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'pull_request'
        && (github.event.action != 'labeled' || github.event.label.name == 'native-ci'))
      && format('pr-{0}', github.event.pull_request.number)
      || github.run_id }}
  cancel-in-progress: true
jobs:
  # docs/quality.md#running-them-in-ci: the run is split into SHARDS jobs, balanced by
  # docker/disposable-server/durations.json; `record` records the release only when all pass.
  disposable-server:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (contains(github.event.pull_request.labels.*.name, 'native-ci')
        && (github.event.action != 'labeled' || github.event.label.name == 'native-ci'))
    name: disposable-server (Ubuntu ${{ matrix.release }}, ${{ matrix.shard }}/7)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ["26.04"]
        shard: [1, 2, 3, 4, 5, 6, 7]
    env:
      BARECTL_DEBUG: "1"
      BARECTL_SECRET_KEY: ci-only-not-for-deployment
      BARECTL_DISPOSABLE_RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The pull request's head commit, not its merge commit, so the statuses describe
          # the commit that carries them.
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install browser and build assets
        run: |
          (npm ci && npm run build) &
          assets=$!
          uv sync --locked
          uv run playwright install --with-deps chromium
          wait "$assets"
      - id: baseline-key
        run: |
          key=$(uv run python -m disposable.runner --baseline-cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/native-baselines/${{ matrix.release }}.tar
          key: native-baseline-${{ runner.os }}-${{ runner.arch }}-${{ steps.baseline-key.outputs.key }}
      - run: |
          mkdir -p "$RUNNER_TEMP/native/results"
          export BARECTL_DISPOSABLE_RESULTS="$RUNNER_TEMP/native/results"
          export BARECTL_DISPOSABLE_LOGS="$RUNNER_TEMP/native/logs"
          export BARECTL_NATIVE_BASELINE_CACHE="$RUNNER_TEMP/native-baselines"
          docker/disposable-server/run-tests.sh -- --shard ${{ matrix.shard }}/7
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.release }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/native
          if-no-files-found: ignore
  record:
    needs: disposable-server
    if: ${{ !cancelled() && needs.disposable-server.result != 'skipped' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.HEAD }}
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - run: >-
          docker/disposable-server/record-shards.sh "$(git rev-parse HEAD)"
          "${{ runner.temp }}/native/results" 7
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
