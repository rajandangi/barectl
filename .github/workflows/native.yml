name: Native
# docs/quality.md#native-layer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test instead of the selected branch
        type: string
        required: false
permissions:
  contents: read
# A newer commit on a pull request supersedes its running native check; a manual run keeps
# its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # docs/quality.md#native-affecting-paths: a pull request with no native-affecting change
  # leaves this green at the exempt-path step; every other path is native-affecting.
  paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      affecting: ${{ steps.diff.outputs.affecting }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: diff
        run: |
          affecting=$(git diff --name-only --no-renames \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | docker/disposable-server/native-paths.sh)
          if [ -n "$affecting" ]; then
            echo "affecting=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$affecting"
          else
            echo "affecting=false" >> "$GITHUB_OUTPUT"
          fi
  scenarios:
    needs: paths
    if: always() && (github.event_name != 'pull_request' || needs.paths.outputs.affecting == 'true')
    uses: ./.github/workflows/native-scenarios.yml
    with:
      runner: ubuntu-26.04
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
  # The one required check (docs/quality.md#native-affecting-paths). It replaces the old
  # `native (Ubuntu 26.04)` commit status.
  native:
    needs: [paths, scenarios]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Judge the native check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             [ "${{ needs.paths.outputs.affecting }}" = "false" ]; then
            echo "No native-affecting changes."
            exit 0
          fi
          if [ "${{ needs.scenarios.result }}" = "success" ]; then
            echo "The native scenarios passed."
            exit 0
          fi
          echo "The native scenarios did not pass (${{ needs.scenarios.result }})." >&2
          exit 1
