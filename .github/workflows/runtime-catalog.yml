name: Runtime catalog
# docs/quality.md#runtime-catalog-lock
on:
  pull_request:
    paths:
      - "runtimes/catalog*"
      - "runtimes/lock_generation.py"
      - ".github/install-pinned-nix.sh"
      - ".github/workflows/runtime-catalog.yml"
  push:
    branches:
      - main
    paths:
      - "runtimes/catalog*"
      - "runtimes/lock_generation.py"
      - ".github/install-pinned-nix.sh"
      - ".github/workflows/runtime-catalog.yml"
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    name: catalog lock on ${{ matrix.runner }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Fetch the base branch's lock
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
      - name: Install the pinned Nix
        run: .github/install-pinned-nix.sh
      - name: Regenerate the lock and compare it with the committed one
        run: uv run --no-project python -m runtimes.lock_generation check
      # ADR 0033: a live upstream check reports drift without gating merges.
      - name: Check every locked closure is signed on the official cache
        continue-on-error: true
        run: uv run --no-project python -m runtimes.lock_generation drift
      - name: Report the lock's freshness
        continue-on-error: true
        run: uv run --no-project python -m runtimes.lock_generation freshness
      - name: Realise the catalog from the cache
        continue-on-error: true
        run: uv run --no-project python -m runtimes.lock_generation realise "$(uname -m)-linux"
      - name: Keep the regenerated lock
        if: failure()
        run: uv run --no-project python -m runtimes.lock_generation generate
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: catalog-lock-${{ matrix.runner }}
          path: runtimes/catalog_lock.json
  watch:
    name: catalog drift, freshness and realisation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Fetch the base branch's lock
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
      - name: Install the pinned Nix
        run: .github/install-pinned-nix.sh
      - name: Check every locked closure is signed on the official cache
        run: uv run --no-project python -m runtimes.lock_generation drift
      - name: Fail when the lock is more than 14 days behind the channel head
        run: uv run --no-project python -m runtimes.lock_generation freshness
      - name: Realise the catalog on x86_64 with max-jobs 0
        run: uv run --no-project python -m runtimes.lock_generation realise "$(uname -m)-linux"
