[project]
name = "barectl"
version = "0.3.0"
description = "Agentless management for native Linux web servers"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "django==6.1.1",
    "django-tasks-db==0.13.0",
    "paramiko==5.0.0",
    "pyinfra==3.10.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]==6.1.1",
    "djlint>=1.46,<1.47",
    "mypy>=2.3,<2.4",
    "pip-audit>=2.10.1",
    "playwright==1.63.0",
    "ruff>=0.16,<0.17",
    "types-paramiko==5.0.0.20260724",
    "vulture>=2.16",
]

[tool.uv]
# pyinfra 3.10.0 declares paramiko<5; its maintainers raised the bound to <6 on the 3.x
# branch (pyinfra-dev/pyinfra#1743) to avoid CVE-2026-44405. Remove these overrides once a
# pyinfra release carries that bound. discovery/test_ssh.py exercises the combination.
override-dependencies = ["paramiko==5.0.0", "types-paramiko==5.0.0.20260724"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "A", "ANN", "ASYNC", "B", "C4", "C90", "DJ", "DTZ", "E", "EXE", "F",
    "FA", "FURB", "G", "I", "ICN", "INP", "ISC", "LOG", "PERF", "PIE",
    "PLE", "PLW", "RET", "RUF", "S", "SIM", "T10", "T20", "UP", "YTT",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Django generates class-level migration lists; preserve that framework format.
"**/migrations/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.14"
files = ["."]
plugins = ["mypy_django_plugin.main"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
strict_bytes = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "truthy-bool", "truthy-iterable",
    "unused-awaitable", "exhaustive-match", "explicit-override", "mutable-override",
]

[tool.django-stubs]
django_settings_module = "config.settings"
strict_settings = true
strict_model_abstract_attrs = true

[[tool.mypy.overrides]]
# Django-generated migration metadata intentionally narrows its base-class fields.
module = ["*.migrations.*"]
disable_error_code = ["mutable-override"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100

[tool.vulture]
paths = ["."]
exclude = ["*/.venv/*", "*/node_modules/*", "*/.git/*", "*/.codex/*", "*/staticfiles/*", "*/static/dist/*"]
# docs/quality.md#dead-code-checks
min_confidence = 60
sort_by_size = true
